replicaCount: 3

image:
  tag: "latest"

env:
  APP_ENV: production
  API_WORKERS: "8"
  LOG_LEVEL: ERROR
  ENABLE_TRACING: "true"

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

ingress:
  hosts:
    - host: api.psrit.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: genai-prod-tls
      hosts:
        - api.psrit.com
