version: "3.9"

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_ENV: development
    container_name: rag-chatbot
    ports:
      - "8000:8000"
    env_file:
      - ../configs/dev/.env.dev
    volumes:
      - ../src:/app/src
      - ../data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rag-network

  redis:
    image: redis:7-alpine
    container_name: rag-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - rag-network

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: rag-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - rag-network

  grafana:
    image: grafana/grafana:11.1.0
    container_name: rag-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - rag-network

volumes:
  redis-data:
  grafana-data:

networks:
  rag-network:
    driver: bridge
